# =====================================================================
#  Rodent League - structures and defenses
# =====================================================================

# --- Grand Terrier (construction yard) -------------------------------
rd_fact:
	Inherits: FACT
	Tooltip:
		Name: actor-rd-fact.name
	Buildable:
		Prerequisites: ~disabled
	RenderSprites:
		Image: rd_fact
	Transforms:
		IntoActor: rd_mcv
	ProvidesPrerequisite@rodents:
		Prerequisite: structures.rodents
	SpawnActorsOnSell:
		ActorTypes: rd_guard, rd_guard, rd_scout, rd_sapper
		GuaranteedActorTypes: rd_guard

# --- Roue a ecureuil (power) -----------------------------------------
rd_powr:
	Inherits: POWR
	Tooltip:
		Name: actor-rd-powr.name
	Buildable:
		Prerequisites: ~structures.rodents
		Description: actor-rd-powr.description
	RenderSprites:
		Image: rd_powr
	ProvidesPrerequisite@buildingname:
	SpawnActorsOnSell:
		ActorTypes: rd_guard, rd_guard, rd_scout, rd_sapper
		GuaranteedActorTypes: rd_guard

# --- Reserve de noisettes (refinery + winter stock bonus) ------------
rd_proc:
	Inherits: PROC
	Tooltip:
		Name: actor-rd-proc.name
	Buildable:
		Prerequisites: rd_powr, ~structures.rodents
		Description: actor-rd-proc.description
	RenderSprites:
		Image: rd_proc
	FreeActor:
		Actor: rd_harv
	CashTrickler@WINTERSTOCK:
		Interval: 250
		Amount: 10
	SpawnActorsOnSell:
		ActorTypes: rd_guard, rd_guard, rd_scout, rd_sapper
		GuaranteedActorTypes: rd_guard

