# --- Rocher du guetteur (radar + Alarm Whistle) ----------------------
rd_radar:
	Inherits: DOME
	Tooltip:
		Name: actor-rd-radar.name
	Buildable:
		Prerequisites: rd_proc, ~structures.rodents
		Description: actor-rd-radar.description
	RenderSprites:
		Image: rd_radar
	SpawnActorPower@WHISTLE:
		PauseOnCondition: disabled
		OrderName: AlarmWhistle
		Name: actor-rd-radar.spawnactorpower-name
		Description: actor-rd-radar.spawnactorpower-description
		Icon: gps
		ChargeInterval: 6000
		Actor: rd_whistle_camera
		DeploySound: alarm.wav
		LifeTime: 500
		SupportPowerPaletteOrder: 20
	SupportPowerChargeBar:
	SpawnActorsOnSell:
		ActorTypes: rd_guard, rd_guard, rd_scout, rd_sapper
		GuaranteedActorTypes: rd_guard

rd_whistle_camera:
	Inherits: CAMERA
	RevealsShroud:
		Range: 8c0
	DetectCloaked:
		DetectionTypes: Underground, Cloak
		Range: 8c0

# --- Grotte d'hibernation (tech center) ------------------------------
rd_cave:
	Inherits: STEK
	Tooltip:
		Name: actor-rd-cave.name
	Buildable:
		Prerequisites: rd_weap, rd_radar, ~structures.rodents
		Description: actor-rd-cave.description
	RenderSprites:
