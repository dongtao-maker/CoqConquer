	ProvidesPrerequisite@rodents:
		Prerequisite: techcenter.rodents
	SpawnActorsOnSell:
		ActorTypes: rd_guard, rd_guard, rd_scout, rd_sapper
		GuaranteedActorTypes: rd_guard

# --- Sommet enneige (superweapon: Avalanche) -------------------------
rd_summit:
	Inherits: MSLO
	Tooltip:
		Name: actor-rd-summit.name
	Buildable:
		Prerequisites: rd_cave, ~structures.rodents
		Description: actor-rd-summit.description
	RenderSprites:
		Image: rd_summit
	NukePower:
		Name: actor-rd-summit.nukepower-name
		Description: actor-rd-summit.nukepower-description
		MissileWeapon: Avalanche
		ChargeInterval: 15000
	SpawnActorsOnSell:
		ActorTypes: rd_guard, rd_guard, rd_scout, rd_sapper
		GuaranteedActorTypes: rd_guard

