# =====================================================================
#  HERO - Dong TaoRhlélas
#  Giant rooster. Area stomp, pecks aircraft, crushes infantry,
#  +15% damage aura for nearby chickens. Limited to 1.
# =====================================================================
dt_dongtaorhlelas:
	Inherits: ^Soldier
	Inherits@DT: ^DongTaoUnit
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	WithInfantryBody:
		DefaultAttackSequence: shoot
	Buildable:
		Queue: Infantry
		BuildPaletteOrder: 100
		Prerequisites: ~infantry.dongtao, ~techcenter.dongtao
		BuildLimit: 1
		Description: actor-dt-dongtaorhlelas.description
	Valued:
		Cost: 2000
	Tooltip:
		Name: actor-dt-dongtaorhlelas.name
	Health:
		HP: 140000
	Armor:
		Type: Heavy
	Mobile:
		Speed: 50
		Locomotor: giantfoot
	RevealsShroud:
		Range: 7c0
	Armament@STOMP:
		Weapon: DT_TaoStomp
	Armament@PECK:
		Weapon: DT_TaoPeck
	AttackFrontal:
	-Crushable:
	-TakeCover:
	-Passenger:
	ChangesHealth:
		PercentageStep: 1
		Delay: 50
		StartIfBelow: 100
		DamageCooldown: 200
	ProximityExternalCondition@ELDERCRY:
		Condition: elder-cry
		Range: 5c0
		ValidRelationships: Ally
	WithRangeCircle@ELDERCRY:
		Type: elder-cry
		Range: 5c0
	RenderSprites:
		Image: dt_dongtaorhlelas
	Voiced:
		VoiceSet: HeroChickenVoice
