# =====================================================================
#  Dong Tao faction - infantry and hero
#  Placeholder art: Red Alert infantry sprites (RenderSprites > Image).
# =====================================================================

# Chickens get +15% damage near the hero (aura "elder-cry").
^DongTaoChicken:
	ExternalCondition@ELDER:
		Condition: elder-cry
	FirepowerMultiplier@ELDER:
		RequiresCondition: elder-cry
		Modifier: 115

# --- Poussin (chick, scout) ------------------------------------------
dt_chick:
	Inherits: ^Soldier
	Inherits@DT: ^DongTaoUnit
	Inherits@CHICKEN: ^DongTaoChicken
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	WithInfantryBody:
		DefaultAttackSequence: shoot
	Buildable:
		Queue: Infantry
		BuildPaletteOrder: 10
		Prerequisites: ~infantry.dongtao
		Description: actor-dt-chick.description
	Valued:
		Cost: 50
	Tooltip:
		Name: actor-dt-chick.name
	Health:
		HP: 2500
	Mobile:
		Speed: 96
	RevealsShroud:
		Range: 7c0
	DetectCloaked@BURROW:
		DetectionTypes: Underground
		Range: 4c0
	Armament:
		Weapon: DT_ChickPeck
	AttackFrontal:
	RenderSprites:
		Image: dt_chick
	Armament@GARRISONED:
		Name: garrisoned
		Weapon: DT_NestMG
	Voiced:
		VoiceSet: ChickVoice

