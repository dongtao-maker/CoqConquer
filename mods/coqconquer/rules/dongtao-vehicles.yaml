# --- Poulicoptere: bamboo helicopter lifted by 4 Dong Tao chickens tied to the rotor sticks.
# The chickens are passengers: unload them and it cannot fly. Egg grenadiers aboard drop egg bombs.
dt_chickcopter:
	Inherits: TRAN
	Inherits@DT: ^DongTaoUnit
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Buildable:
		Queue: Vehicle
		BuildAtProductionType: Vehicle
		BuildPaletteOrder: 85
		Prerequisites: ~vehicles.dongtao, dt_radar
		Description: actor-dt-chickcopter.description
	Valued:
		Cost: 800
	Tooltip:
		Name: actor-dt-chickcopter.name
	Health:
		HP: 9000
	Armor:
		Type: Light
	Aircraft:
		Speed: 110
		TurnSpeed: 24
		PauseOnCondition: !rotor-chicken
	Cargo:
		Types: Infantry
		MaxWeight: 6
		InitialUnits: dt_chicken, dt_chicken, dt_chicken, dt_chicken
		PassengerConditions:
			dt_chicken: rotor-chicken
			dt_grenadier: grenadier-aboard
	Armament@BOMB1:
		Weapon: DT_EggBomb
		LocalOffset: 0,0,-213
		RequiresCondition: grenadier-aboard >= 1
	Armament@BOMB2:
		Weapon: DT_EggBomb
		LocalOffset: 0,0,-213
		FireDelay: 12
		RequiresCondition: grenadier-aboard >= 2
	AttackAircraft:
		FacingTolerance: 512
		PersistentTargeting: false
		AttackType: Hover
		OpportunityFire: False
	-WithIdleOverlay@ROTOR1AIR:
	-WithIdleOverlay@ROTOR1GROUND:
	-WithIdleOverlay@ROTOR2AIR:
	-WithIdleOverlay@ROTOR2GROUND:
	WithIdleOverlay@ROTORAIR:
		Sequence: rotor
		RequiresCondition: rotor-chicken && airborne
	WithIdleOverlay@ROTORGROUND:
		Sequence: slow-rotor
		RequiresCondition: rotor-chicken && !airborne
	WithIdleOverlay@ROTORBARE:
		Sequence: bare-rotor
		RequiresCondition: !rotor-chicken
	RenderSprites:
		Image: dt_chickcopter
	-SpawnActorOnDeath:
	Voiced:
		VoiceSet: DongTaoVehicleVoice
	Selectable:
		DecorationBounds: 1706, 1536
