# --- Mine d'or: a buildable "oil derrick" where chickens mine gold (steady income) ---
dt_goldmine:
	Inherits: ^Building
	Inherits@shape: ^2x2Shape
	Selectable:
		Bounds: 2048, 2048
	Buildable:
		Queue: Building
		BuildPaletteOrder: 75
		BuildLimit: 3
		Prerequisites: dt_proc, ~structures.dongtao
		Description: actor-dt-goldmine.description
	Valued:
		Cost: 1200
	Tooltip:
		Name: actor-dt-goldmine.name
	Building:
		Footprint: xx xx
		Dimensions: 2,2
	Health:
		HP: 60000
	Armor:
		Type: Wood
	RevealsShroud:
		Range: 4c0
	Power:
		Amount: -20
	CashTrickler:
		Interval: 375
		Amount: 60
	RenderSprites:
		Image: dt_goldmine
	ProvidesPrerequisite@buildingname:
	SpawnActorsOnSell:
		ActorTypes: dt_chicken, dt_chicken, dt_chick, dt_farmer
		GuaranteedActorTypes: dt_chicken

# --- Grenier a riz (refinery) ----------------------------------------
dt_proc:
	Inherits: PROC
	Tooltip:
		Name: actor-dt-proc.name
	Buildable:
		Prerequisites: dt_powr, ~structures.dongtao
		Description: actor-dt-proc.description
	RenderSprites:
		Image: dt_proc
	FreeActor:
		Actor: dt_harv
	SpawnActorsOnSell:
		ActorTypes: dt_chicken, dt_chicken, dt_chick, dt_farmer
		GuaranteedActorTypes: dt_chicken

# --- Poulailler (barracks) -------------------------------------------
dt_barr:
	Inherits: TENT
	Inherits@AUTOTARGET: ^AutoTargetGround
	Inherits@CARGOPIPS: ^CargoPips
	Tooltip:
		Name: actor-dt-barr.name
	Buildable:
		Prerequisites: dt_powr, ~structures.dongtao
		Description: actor-dt-barr.description
	RenderSprites:
		Image: dt_barr
	ProvidesPrerequisite@dongtao:
		Prerequisite: infantry.dongtao
	# Up to 4 chickens / egg grenadiers can sit on the roof and attack from there.
	Cargo:
		Types: Infantry
		MaxWeight: 4
		PassengerConditions:
			dt_chicken: roof-chicken
			dt_grenadier: roof-grenadier
	AttackGarrisoned:
		PauseOnCondition: build-incomplete
		Armaments: garrisoned
		PortOffsets: 0,0,900, 0,0,900, 0,0,900, 0,0,900, 0,0,900, 0,0,900
		PortYaws: 0, 171, 341, 512, 683, 853
		PortCones: 100, 100, 100, 100, 100, 100
	WithIdleOverlay@ROOFCHICKEN1:
		Sequence: roof-chicken1
		RequiresCondition: roof-chicken >= 1
	WithIdleOverlay@ROOFCHICKEN2:
		Sequence: roof-chicken2
		RequiresCondition: roof-chicken >= 2
	WithIdleOverlay@ROOFGRENADIER1:
		Sequence: roof-grenadier1
		RequiresCondition: roof-grenadier >= 1
	WithIdleOverlay@ROOFGRENADIER2:
		Sequence: roof-grenadier2
		RequiresCondition: roof-grenadier >= 2
	SpawnActorsOnSell:
		ActorTypes: dt_chicken, dt_chicken, dt_chick, dt_farmer
		GuaranteedActorTypes: dt_chicken

