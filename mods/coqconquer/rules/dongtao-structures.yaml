# --- Pagode de guet (radar) + Chant de l'aube ------------------------
dt_radar:
	Inherits: DOME
	Tooltip:
		Name: actor-dt-radar.name
	Buildable:
		Prerequisites: dt_proc, ~structures.dongtao
		Description: actor-dt-radar.description
	RenderSprites:
		Image: dt_radar
	DetectCloaked@BURROW:
		DetectionTypes: Underground
		Range: 8c0
	GrantExternalConditionPower@DAWNSONG:
		PauseOnCondition: disabled
		OrderName: DawnSong
		Name: actor-dt-radar.grantexternalconditionpower-name
		Description: actor-dt-radar.grantexternalconditionpower-description
		Icon: invuln
		ChargeInterval: 6000
		Condition: dawn-song
		OnFireSound: crow.wav
		Duration: 500
		Dimensions: 5, 5
		Footprint: xxxxx xxxxx xxxxx xxxxx xxxxx
		ValidRelationships: Ally
		BlockedCursor: move-blocked
		SupportPowerPaletteOrder: 20
	SupportPowerChargeBar:
	SpawnActorsOnSell:
		ActorTypes: dt_chicken, dt_chicken, dt_chick, dt_farmer
		GuaranteedActorTypes: dt_chicken

