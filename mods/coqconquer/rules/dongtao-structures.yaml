# =====================================================================
#  Dong Tao faction - structures
#  Placeholder art: each building reuses a Red Alert sprite through
#  RenderSprites > Image, so the faction can be tested before new art.
# =====================================================================

# --- Cour de ferme (construction yard) -------------------------------
dt_fact:
	Inherits: FACT
	Tooltip:
		Name: actor-dt-fact.name
	Buildable:
		Prerequisites: ~disabled
	RenderSprites:
		Image: dt_fact
	Transforms:
		IntoActor: dt_mcv
	ProvidesPrerequisite@dongtao:
		Prerequisite: structures.dongtao
	SpawnActorsOnSell:
		ActorTypes: dt_chicken, dt_chicken, dt_chick, dt_farmer
		GuaranteedActorTypes: dt_chicken

