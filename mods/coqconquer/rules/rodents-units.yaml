# --- Ecureuil eclaireur (scout) --------------------------------------
rd_scout:
	Inherits: ^Soldier
	Inherits@RD: ^RodentUnit
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	WithInfantryBody:
		DefaultAttackSequence: shoot
	Buildable:
		Queue: Infantry
		BuildPaletteOrder: 10
		Prerequisites: ~infantry.rodents
		Description: actor-rd-scout.description
	Valued:
		Cost: 60
	Tooltip:
		Name: actor-rd-scout.name
	Health:
		HP: 2000
	Mobile:
		Speed: 113
	RevealsShroud:
		Range: 8c0
	Armament:
		Weapon: DT_ChickPeck
	RenderSprites:
		Image: rd_scout
	Armament@GARRISONED:
		Name: garrisoned
		Weapon: RD_AcornVolley
	Voiced:
		VoiceSet: SquirrelVoice

