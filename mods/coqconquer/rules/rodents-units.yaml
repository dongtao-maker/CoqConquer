# =====================================================================
#  HERO - Le Grand Siffleur (The Great Whistler)
#  Giant ancestral marmot. Whistle slows enemies around him,
#  short-range burrow teleport, +20% speed aura for rodents.
#  Fragile for a hero but very hard to catch. Limited to 1.
# =====================================================================
rd_greatwhistler:
	Inherits: ^Soldier
	Inherits@RD: ^RodentUnit
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	WithInfantryBody:
		DefaultAttackSequence: shoot
	Buildable:
		Queue: Infantry
		BuildPaletteOrder: 100
		Prerequisites: ~infantry.rodents, ~techcenter.rodents
		BuildLimit: 1
		Description: actor-rd-greatwhistler.description
	Valued:
		Cost: 2000
	Tooltip:
		Name: actor-rd-greatwhistler.name
	Health:
		HP: 60000
	Armor:
		Type: Light
	Mobile:
		Speed: 75
	RevealsShroud:
		Range: 8c0
	Armament@WHISTLE:
		Weapon: RD_Whistle
	AttackFrontal:
	PortableChrono:
		ChargeDelay: 375
		MaxDistance: 8
		ChronoshiftSound: burrow.wav
	DetectCloaked:
		DetectionTypes: Underground, Cloak
		Range: 5c0
	-TakeCover:
	-Passenger:
	ChangesHealth:
		PercentageStep: 1
		Delay: 50
		StartIfBelow: 100
		DamageCooldown: 200
	ProximityExternalCondition@RALLY:
		Condition: rally
		Range: 5c0
		ValidRelationships: Ally
	RenderSprites:
		Image: rd_greatwhistler
	Voiced:
		VoiceSet: HeroMarmotVoice

