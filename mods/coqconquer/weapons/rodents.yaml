# HERO whistle: area damage + slows enemies by 50% for 3 seconds.
RD_Whistle:
	ValidTargets: Ground, Water, GroundActor, WaterActor
	ReloadDelay: 75
	Range: 3c0
	Report: hwhistle.wav
	Projectile: InstantHit
	Warhead@1Dam: SpreadDamage
		ValidTargets: GroundActor, WaterActor
		Spread: 2c0
		Damage: 5000
		ValidRelationships: Enemy, Neutral
		Versus:
			None: 100
			Wood: 30
			Light: 50
			Heavy: 25
			Concrete: 20
		DamageTypes: Prone50Percent, TriggerProne, DefaultDeath
	Warhead@2Slow: GrantExternalCondition
		ValidTargets: GroundActor, WaterActor
		Range: 2c0
		Duration: 75
		Condition: whistled
		ValidRelationships: Enemy

