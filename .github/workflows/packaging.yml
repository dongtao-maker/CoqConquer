name: Release Packaging

# Publishing a version: write the version number in RELEASE_VERSION and push to the
# "release" branch (or push a Git tag). The release page and its tag are created automatically.
on:
  push:
    tags:
    - '*'
    branches:
    - release
  workflow_dispatch:

permissions:
  contents: write  #  for release creation (svenstaro/upload-release-action)

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    steps:
      - name: Clone Repository
        uses: actions/checkout@v6

      - name: Create release page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then TAG="${GITHUB_REF#refs/tags/}"; else TAG="$(tr -d '[:space:]' < RELEASE_VERSION)"; fi
          gh release view "${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
          gh release create "${TAG}" --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Coq et Conquer ${TAG}" \
            --notes "Windows : CoqConquer-...-x64.exe (installateur). Linux : CoqConquer-...-x86_64.AppImage. Mac : CoqConquer-....dmg (clic droit > Ouvrir au premier lancement)."

  linux:
    name: Linux AppImages
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - name: Clone Repository
        uses: actions/checkout@v6

      - name: Install .NET 6.0
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '6.0.x'

      - name: Prepare Environment
        run: if [[ "${GITHUB_REF}" == refs/tags/* ]]; then echo "GIT_TAG=${GITHUB_REF#refs/tags/}" >> ${GITHUB_ENV}; else echo "GIT_TAG=$(tr -d '[:space:]' < RELEASE_VERSION)" >> ${GITHUB_ENV}; fi

      - name: Package AppImage
        run: |
          make engine
          mkdir -p build/linux
          sudo apt-get install -y desktop-file-utils
          ./packaging/linux/buildpackage.sh "${GIT_TAG}" "${PWD}/build/linux"

      - name: Upload Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${GIT_TAG}" build/linux/*

  macos:
    name: macOS Disk Image
    needs: release
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Clone Repository
        uses: actions/checkout@v6

      - name: Install .NET 6.0
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '6.0.x'

      - name: Prepare Environment
        run: if [[ "${GITHUB_REF}" == refs/tags/* ]]; then echo "GIT_TAG=${GITHUB_REF#refs/tags/}" >> ${GITHUB_ENV}; else echo "GIT_TAG=$(tr -d '[:space:]' < RELEASE_VERSION)" >> ${GITHUB_ENV}; fi

      - name: Package Disk Image
        env:
          MACOS_DEVELOPER_IDENTITY: ${{ secrets.MACOS_DEVELOPER_IDENTITY }}
          MACOS_DEVELOPER_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_CERTIFICATE_BASE64 }}
          MACOS_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_CERTIFICATE_PASSWORD }}
          MACOS_DEVELOPER_USERNAME: ${{ secrets.MACOS_DEVELOPER_USERNAME }}
          MACOS_DEVELOPER_PASSWORD: ${{ secrets.MACOS_DEVELOPER_PASSWORD }}
        run: |
          make engine
          mkdir -p build/macos
          ./packaging/macos/buildpackage.sh "${GIT_TAG}" "${PWD}/build/macos"

      - name: Upload Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${GIT_TAG}" build/macos/*

  windows:
    name: Windows Installers
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - name: Clone Repository
        uses: actions/checkout@v6

      - name: Install .NET 6.0
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '6.0.x'

      - name: Prepare Environment
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then echo "GIT_TAG=${GITHUB_REF#refs/tags/}" >> ${GITHUB_ENV}; else echo "GIT_TAG=$(tr -d '[:space:]' < RELEASE_VERSION)" >> ${GITHUB_ENV}; fi
          sudo apt-get update
          sudo apt-get install nsis wine64

      - name: Package Installers
        run: |
          make engine
          mkdir -p build/windows
          ./packaging/windows/buildpackage.sh "${GIT_TAG}" "${PWD}/build/windows"

      - name: Upload Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${GIT_TAG}" build/windows/*
